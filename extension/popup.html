<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MakGuard</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 280px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0a0a0a;
        color: #f5f5f5;
        padding: 16px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      .logo {
        width: 32px;
        height: 32px;
        background: rgba(147, 51, 234, 0.2);
        border: 1px solid rgba(147, 51, 234, 0.3);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }
      h1 {
        font-size: 16px;
        font-weight: 700;
      }
      .subtitle {
        font-size: 11px;
        color: #737373;
        font-family: ui-monospace, monospace;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        background: #171717;
        border: 1px solid #262626;
        border-radius: 10px;
        margin-bottom: 12px;
      }
      .toggle-label {
        font-size: 14px;
        font-weight: 500;
      }
      .toggle-status {
        font-size: 11px;
        color: #737373;
        margin-top: 2px;
      }
      .switch {
        position: relative;
        width: 44px;
        height: 24px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #404040;
        border-radius: 24px;
        transition: 0.2s;
      }
      .slider:before {
        position: absolute;
        content: '';
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: white;
        border-radius: 50%;
        transition: 0.2s;
      }
      input:checked + .slider {
        background: #9333ea;
      }
      input:checked + .slider:before {
        transform: translateX(20px);
      }
      .link {
        display: block;
        text-align: center;
        font-size: 12px;
        color: #c084fc;
        text-decoration: none;
        padding: 8px;
      }
      .link:hover {
        text-decoration: underline;
      }
      .footer {
        font-size: 10px;
        color: #525252;
        text-align: center;
        margin-top: 8px;
        font-family: ui-monospace, monospace;
      }
      .call-guard-section {
        margin-bottom: 12px;
      }
      .call-guard-btn {
        width: 100%;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
      }
      .call-guard-btn:hover {
        opacity: 0.9;
      }
      .call-guard-btn:active {
        transform: scale(0.98);
      }
      .call-guard-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .call-guard-btn.active {
        background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      }
      .call-guard-hint {
        font-size: 11px;
        color: #737373;
        text-align: center;
        margin-top: 6px;
      }
      .call-guard-hint.error {
        color: #f87171;
      }
      .call-guard-hint.success {
        color: #4ade80;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">🛡</div>
      <div>
        <h1>MakGuard</h1>
        <p class="subtitle">Passive scam shield</p>
      </div>
    </div>

    <div class="toggle-row">
      <div>
        <p class="toggle-label">Protection</p>
        <p class="toggle-status" id="status-text">Checking…</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="enabled-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <div>
        <p class="toggle-label">Call Guard</p>
        <p class="toggle-status" id="call-guard-status-text">Meet & Teams web</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="call-guard-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div id="call-guard-start-section" class="call-guard-section" style="display:none;">
      <button type="button" id="start-call-guard-btn" class="call-guard-btn">
        🎙 Start Call Guard
      </button>
      <p class="call-guard-hint" id="call-guard-hint">Click to enable tab audio capture for this call</p>
    </div>

    <div class="toggle-row">
      <div>
        <p class="toggle-label">Dev: local API</p>
        <p class="toggle-status" id="local-api-status-text">Uses production API</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="local-api-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <a class="link" href="https://makguard.vercel.app/dashboard" target="_blank" rel="noopener noreferrer">
      Open dashboard →
    </a>
    <a class="link" href="https://makguard.vercel.app/demo/scam.html" target="_blank" rel="noopener noreferrer">
      Try demo scam page →
    </a>

    <p class="footer">Passive page scan + Call Guard on Meet / Teams (web)</p>

    <script src="popup.js"></script>
  </body>
</html>
